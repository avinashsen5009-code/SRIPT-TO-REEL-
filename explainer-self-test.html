<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explainer + Story · 20-scene review</title>
<style>body{background:#111a2b;color:#f4f1e9;font:16px system-ui;margin:0;padding:24px}main{max-width:1100px;margin:auto}button{background:#3b82f6;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}canvas{width:100%;height:auto;display:block;background:#eee8dd;margin-top:18px}p{line-height:1.5}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style>
<main><h1>Story × Explainer · visual review</h1><p>Twenty original English, Hindi and Hinglish sentences, rendered twice through the actual app canvas. Test audio is a silent local buffer, not speech recognition. This page uses an isolated embedded editor; it does not modify your open project.</p><button id="download" disabled>Generating contact sheet…</button><p id="status" role="status">Starting…</p><div id="result"></div></main>
<iframe src="index.html" data-test-frame title="Isolated reel renderer"></iframe>
<script>
const frame=document.querySelector('iframe'),button=document.querySelector('#download'),status=document.querySelector('#status');
frame.onload=async()=>{try{const result=await frame.contentWindow.buildStyleContactSheet();document.querySelector('#result').append(result.canvas);status.textContent=result.failures.length?'Render errors: '+JSON.stringify(result.failures):'40 previews rendered: 20 Story scenes and 20 Explainer scenes. Review the pictures; this is not a semantic accuracy test.';button.disabled=false;button.textContent='Download PNG contact sheet';button.onclick=()=>{const a=document.createElement('a');a.download='story-explainer-20-scene-review.png';a.href=result.canvas.toDataURL('image/png');a.click()}}catch(e){status.textContent='Could not complete review: '+e.message;button.disabled=true}};
</script></html>
